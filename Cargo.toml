[package]
name = "rtouch"
version = "1.5.1"
edition = "2024"
description= "A custom touch implementation, written in Rust"
license = "GPL-3.0-or-later"


[dependencies]
chrono = { version = "0.4.38", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.5", features = ["derive"] }
dirs-next = "2.0.0"
fs-err = "3.3.1"

[profile.dev]
debug = "line-tables-only" # More than enogh to debug and find the error, and speeds up compile times


[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[[bin]]
name = "rtouch"
path = "src/main.rs"

[lib]
name = "rtouch"
path = "src/lib.rs"
